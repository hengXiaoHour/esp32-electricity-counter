<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ESP32 Electricity Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="connectPanel">
  <div class="connect-card">
    <div class="connect-icon"></div>
    <h1 class="connect-title">Electricity Monitor</h1>
    <p class="connect-sub">Connect to ESP32-S3</p>
    <div class="connect-row">
      <input type="text" id="esp32Ip" placeholder="192.168.1.x" spellcheck="false" autocomplete="off">
      <button id="connectBtn" onclick="handleConnect()">Connect</button>
    </div>
    <div id="connectStatus" class="connect-status disconnected">Enter the ESP32 IP address and connect</div>
    <div class="connect-hint">Opens a WebSocket to <span id="wsHint">ws://&lt;ip&gt;/ws</span></div>
  </div>
</div>

<div id="dashboard" class="hidden">
  <div id="header">
    <div id="headerLeft">
      <h1>Electricity Monitor</h1>
      <span id="connectedBadge" class="connected-badge">● <span id="connectedIp">-</span></span>
    </div>
    <div id="sysInfo">
      <span id="voltage">--.- V</span>
      <span id="wifiStatus">-</span>
      <span id="currentTime">--:--:--</span>
      <span id="ledStatus"></span>
    </div>
  </div>

  <div id="connectionBar">
    <span id="connStatus">● Connected</span>
    <button id="disconnectBtn" onclick="handleDisconnect()">Disconnect</button>
  </div>

  <div id="otaPanel" class="hidden">
    <div class="ota-header">OTA Update In Progress</div>
    <div class="ota-progress-track"><div id="otaProgress" class="ota-progress-fill"></div></div>
    <div class="ota-meta">
      <span id="otaPercent">0%</span>
      <span id="otaVersion">-</span>
    </div>
  </div>

  <div id="channels"></div>

  <div id="eventsPanel">
    <h3>Event Log</h3>
    <div id="eventList"></div>
  </div>

  <div id="settingsPanel">
    <h3>Calibration</h3>
    <div class="cal-row">
      <label>Voltage Cal:</label>
      <input type="number" id="voltCal" step="0.1">
      <button onclick="sendVoltageCal()">Set</button>
    </div>
    <div class="cal-section-divider">Per-Channel Current Calibration</div>
    <div id="currentCalRows"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
